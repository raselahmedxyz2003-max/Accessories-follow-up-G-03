<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accessories Follow Up G-3</title>
<style>
body{margin:0;font-family:sans-serif;background:#f1f5f9}
.top{background:#1e3a8a;color:white;text-align:center;padding:16px;font-size:20px;font-weight:bold}
.box{max-width:1000px;margin:10px auto;padding:10px}
.card{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.btn{padding:12px 18px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;color:white;background:#1e3a8a}
.btn-green{background:#16a34a}
.btn-red{background:#dc2626}
.btn-yellow{background:#eab308;color:black}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:8px;text-align:center;font-size:14px}
th{background:#1e3a8a;color:white}
input,select{padding:6px;width:95%;box-sizing:border-box}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr} table{font-size:12px}}
</style>
</head>
<body>
<div class="top">Accessories Follow Up G-3</div>
<div class="box">

<div class="card">
<h3>Search Job No</h3>
<div class="search">
<input id="searchInput" placeholder="Job No likho... ex: G3-101">
<button class="btn" onclick="searchJob()">Search</button>
<button class="btn-yellow" onclick="showAll()">Show All</button>
</div>
</div>

<div class="card">
<h3>New Data Entry</h3>
<div class="form-grid">
<input id="jobNo" placeholder="Job No *">
<input id="buyer" placeholder="Buyer">
<input id="item" placeholder="Item Name">
<input id="supplier" placeholder="Supplier">
<input id="orderQty" type="number" placeholder="Order Qty">
<input id="receivedQty" type="number" placeholder="Received Qty">
<input id="challanNo" placeholder="Challan No">
<input id="shipmentDate" type="date" placeholder="Shipment Date">
<input id="followDate" type="date" placeholder="Follow Up Date">
<select id="status">
<option value="">Status Select</option>
<option>Pending</option>
<option>Ordered</option>
<option>Shipped</option>
<option>Received</option>
<option>Follow Up</option>
</select>
<input id="remarks" placeholder="Remarks" style="grid-column: span 2">
</div>
<button class="btn btn-green" style="width:100%;margin-top:10px" onclick="addData()">Add / Save</button>
</div>

<div class="card">
<h3>Follow Up List (<span id="count">0</span>)</h3>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Job No</th><th>Buyer</th><th>Item</th><th>Supplier</th><th>Order Qty</th><th>Received</th><th>Balance</th><th>Challan No</th><th>Shipment Date</th><th>Follow Date</th><th>Status</th><th>Remarks</th><th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
<button class="btn" style="margin-top:10px" onclick="exportExcel()">Export Excel</button>
</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem('accessories_g3_data') || '[]');
let editIndex = -1;

function save() {
  localStorage.setItem('accessories_g3_data', JSON.stringify(data));
  render();
}

function addData() {
  let jobNo = document.getElementById('jobNo').value.trim();
  if(!jobNo){alert('Job No must be required'); return;}
  let item = {
    jobNo: jobNo,
    buyer: document.getElementById('buyer').value,
    item: document.getElementById('item').value,
    supplier: document.getElementById('supplier').value,
    orderQty: document.getElementById('orderQty').value,
    receivedQty: document.getElementById('receivedQty').value,
    challanNo: document.getElementById('challanNo').value,
    shipmentDate: document.getElementById('shipmentDate').value,
    followDate: document.getElementById('followDate').value,
    status: document.getElementById('status').value,
    remarks: document.getElementById('remarks').value
  };
  if(editIndex >= 0){
    data[editIndex] = item;
    editIndex = -1;
  } else {
    data.push(item);
  }
  clearForm();
  save();
}

function clearForm(){
  ['jobNo','buyer','item','supplier','orderQty','receivedQty','challanNo','shipmentDate','followDate','remarks'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('status').value='';
}

function render(list){
  let tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  let showList = list || data;
  document.getElementById('count').innerText = showList.length;
  showList.forEach((d,i)=>{
    let balance = (parseFloat(d.orderQty)||0) - (parseFloat(d.receivedQty)||0);
    let realIndex = data.indexOf(d);
    tbody.innerHTML += `<tr>
      <td><b>${d.jobNo}</b></td>
      <td>${d.buyer||''}</td>
      <td>${d.item||''}</td>
      <td>${d.supplier||''}</td>
      <td>${d.orderQty||''}</td>
      <td>${d.receivedQty||''}</td>
      <td>${balance}</td>
      <td>${d.challanNo||''}</td>
      <td>${d.shipmentDate||''}</td>
      <td>${d.followDate||''}</td>
      <td>${d.status||''}</td>
      <td>${d.remarks||''}</td>
      <td>
        <button class="btn-yellow" onclick="editData(${realIndex})">Edit</button>
        <button class="btn-red" onclick="delData(${realIndex})">Delete</button>
      </td>
    </tr>`;
  });
}

function editData(i){
  let d = data[i];
  document.getElementById('jobNo').value = d.jobNo;
  document.getElementById('buyer').value = d.buyer;
  document.getElementById('item').value = d.item;
  document.getElementById('supplier').value = d.supplier;
  document.getElementById('orderQty').value = d.orderQty;
  document.getElementById('receivedQty').value = d.receivedQty;
  document.getElementById('challanNo').value = d.challanNo;
  document.getElementById('shipmentDate').value = d.shipmentDate;
  document.getElementById('followDate').value = d.followDate;
  document.getElementById('status').value = d.status;
  document.getElementById('remarks').value = d.remarks;
  editIndex = i;
  window.scrollTo(0,0);
}

function delData(i){
  if(confirm('Delete korba?')){
    data.splice(i,1);
    save();
  }
}

function searchJob(){
  let q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){alert('Job No likho'); return;}
  let result = data.filter(d => d.jobNo.toLowerCase().includes(q));
  if(result.length===0){alert('Ei Job No pawa jay nai'); render([]);} else {render(result);}
}

function showAll(){document.getElementById('searchInput').value=''; render();}

function exportExcel(){
  let csv = 'Job No,Buyer,Item,Supplier,Order Qty,Received Qty,Balance,Challan No,Shipment Date,Follow Date,Status,Remarks\n';
  data.forEach(d=>{
    let balance = (parseFloat(d.orderQty)||0) - (parseFloat(d.receivedQty)||0);
    csv += `${d.jobNo},${d.buyer},${d.item},${d.supplier},${d.orderQty},${d.receivedQty},${balance},${d.challanNo},${d.shipmentDate},${d.followDate},${d.status},${d.remarks}\n`;
  });
  let blob = new Blob([csv], {type:'text/csv'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'accessories-follow-up-g3.csv';
  a.click();
}

render();
</script>
</body>
</html>
