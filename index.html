<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accessories Follow Up G-3</title>
<style>
body{margin:0;font-family:sans-serif;background:#f1f5f9}
.top{background:#1e3a8a;color:white;text-align:center;padding:16px;font-size:20px;font-weight:bold}
.box{max-width:1200px;margin:10px auto;padding:10px}
.card{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;color:white;background:#1e3a8a}
.btn-green{background:#16a34a}
.btn-red{background:#dc2626}
.btn-yellow{background:#eab308;color:black}
.btn-blue{background:#2563eb}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:8px;text-align:center;font-size:13px;white-space:nowrap;vertical-align:middle}
th{background:#1e3a8a;color:white}
input,select{padding:9px;width:95%;box-sizing:border-box}
label{font-size:13px;font-weight:bold;color:#1e3a8a}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-list{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.row-list input{flex:1}
.summary{background:#ecfdf5;border:1px solid #16a34a;padding:10px;border-radius:8px;margin-top:10px;font-weight:bold}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">Accessories Follow Up G-3</div>
<div class="box">

<div class="card">
<h3>Search Job No</h3>
<div class="search">
<input id="searchInput" placeholder="Job No likho...">
<button class="btn" onclick="searchJob()">Search</button>
<button class="btn-yellow" onclick="showAll()">Show All</button>
</div>
<div id="summaryBox"></div>
</div>

<div class="card">
<h3>New Data Entry</h3>
<div class="form-grid">
<div><label>Job No *</label><input id="jobNo" placeholder="Job No"></div>
<div>
<label>Buyer</label>
<select id="buyer">
<option value="">Buyer Select</option>
<option>C&A</option>
<option>Gina Tricot</option>
<option>Tom Tailor</option>
<option>Zara</option>
<option>Otcf</option>
<option>Gusse</option>
</select>
</div>
<div>
<label>Received By</label>
<select id="receivedBy">
<option value="">Select Name</option>
<option>Rasel Ahmed</option>
<option>Billal hossen</option>
<option>Rakib Ahmed</option>
<option>Sourov chandra Hauladar</option>
</select>
</div>
<div><label>Shipment Date</label><input id="shipmentDate" type="date"></div>
<div><label>Received Date</label><input id="receivedDate" type="date"></div>
<div><label>Follow Up Date</label><input id="followDate" type="date"></div>
<div>
<label>Status</label>
<select id="status">
<option value="">Status Select</option>
<option>Pending</option>
<option>Ordered</option>
<option>Shipped</option>
<option>Received</option>
<option>Follow Up</option>
</select>
</div>
<div><label>Remarks</label><input id="remarks" placeholder="Remarks"></div>
</div>

<div style="margin-top:14px">
<label>Order Name | Item | Order Received Qty</label>
<div id="orderList">
<div class="row-list">
<input placeholder="Order Name" class="orderNo">
<input placeholder="Item" class="orderItem">
<input placeholder="Order Received Qty" type="number" class="orderRecQty" style="max-width:140px">
<button class="btn-red" onclick="this.parentElement.remove()">X</button>
</div>
</div>
<button class="btn btn-blue" onclick="addOrderRow()">+ Add Order No</button>
</div>

<div style="margin-top:14px">
<label>Item Name | Item Received Qty</label>
<div id="itemList">
<div class="row-list">
<input placeholder="Item Name" class="itemName">
<input placeholder="Item Received Qty" type="number" class="itemRecQty" style="max-width:160px">
<button class="btn-red" onclick="this.parentElement.remove()">X</button>
</div>
</div>
<button class="btn btn-blue" onclick="addItemRow()">+ Add Item</button>
</div>

<div style="margin-top:14px">
<label>Challan No</label>
<div id="challanList">
<div class="row-list">
<input placeholder="Challan No" class="challanNo">
<button class="btn-red" onclick="this.parentElement.remove()">X</button>
</div>
</div>
<button class="btn btn-blue" onclick="addChallanRow()">+ Add Challan No</button>
</div>

<button class="btn btn-green" style="width:100%;margin-top:14px" onclick="addData()">Save Job</button>
</div>

<div class="card">
<h3>Follow Up List (<span id="count">0</span>)</h3>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Date</th><th>Buyer</th><th>Job No</th><th>Order Name</th><th>Item</th><th>Order Rec Qty</th><th>Item Name</th><th>Item Rec Qty</th><th>Total Rec</th><th>Challan No</th><th>Received By</th><th>Shipment</th><th>Received</th><th>Follow</th><th>Status</th><th>Remarks</th><th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
<button class="btn" style="margin-top:10px" onclick="exportExcel()">Export Excel</button>
</div>

</div>

<script>
let data = [];
try{ data = JSON.parse(localStorage.getItem('accessories_g3_data') || '[]'); if(!Array.isArray(data)) data=[]; }catch(e){ data=[]; }
let editIndex = -1;

function formatDate(iso){
  if(!iso) return '';
  let p = iso.split('-');
  if(p.length===3) return p[2]+'-'+p[1]+'-'+p[0];
  return iso;
}

function addOrderRow(){
  let div = document.createElement('div');
  div.className = 'row-list';
  div.innerHTML = `<input placeholder="Order Name" class="orderNo"><input placeholder="Item" class="orderItem"><input placeholder="Order Received Qty" type="number" class="orderRecQty" style="max-width:140px"><button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
  document.getElementById('orderList').appendChild(div);
}
function addItemRow(){
  let div = document.createElement('div');
  div.className = 'row-list';
  div.innerHTML = `<input placeholder="Item Name" class="itemName"><input placeholder="Item Received Qty" type="number" class="itemRecQty" style="max-width:160px"><button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
  document.getElementById('itemList').appendChild(div);
}
function addChallanRow(){
  let div = document.createElement('div');
  div.className = 'row-list';
  div.innerHTML = `<input placeholder="Challan No" class="challanNo"><button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
  document.getElementById('challanList').appendChild(div);
}

function save(){localStorage.setItem('accessories_g3_data', JSON.stringify(data)); render();}

function addData(){
  let jobNo = document.getElementById('jobNo').value.trim();
  if(!jobNo){alert('Job No likho'); return;}
  let orders = [];
  document.querySelectorAll('#orderList .row-list').forEach(r=>{
    let no = r.querySelector('.orderNo').value.trim();
    let item = r.querySelector('.orderItem').value.trim();
    let rec = r.querySelector('.orderRecQty').value;
    if(no || item || rec) orders.push({no, item, rec});
  });
  let items = [];
  document.querySelectorAll('#itemList .row-list').forEach(r=>{
    let name = r.querySelector('.itemName').value.trim();
    let rec = r.querySelector('.itemRecQty').value;
    if(name || rec) items.push({name, rec});
  });
  let challans = [];
  document.querySelectorAll('#challanList .challanNo').forEach(c=>{
    if(c.value.trim()) challans.push(c.value.trim());
  });

  let obj = {
    jobNo,
    buyer: document.getElementById('buyer').value,
    receivedBy: document.getElementById('receivedBy').value,
    shipmentDate: document.getElementById('shipmentDate').value,
    receivedDate: document.getElementById('receivedDate').value,
    followDate: document.getElementById('followDate').value,
    status: document.getElementById('status').value,
    remarks: document.getElementById('remarks').value,
    orders, items, challans
  };

  if(editIndex >= 0){data[editIndex]=obj; editIndex=-1;}
  else data.push(obj);

  clearForm();
  save();
  alert('Save hoise');
}

function clearForm(){
  document.getElementById('jobNo').value='';
  document.getElementById('buyer').value='';
  document.getElementById('receivedBy').value='';
  document.getElementById('shipmentDate').value='';
  document.getElementById('receivedDate').value='';
  document.getElementById('followDate').value='';
  document.getElementById('status').value='';
  document.getElementById('remarks').value='';
  document.getElementById('orderList').innerHTML = `<div class="row-list"><input placeholder="Order Name" class="orderNo"><input placeholder="Item" class="orderItem"><input placeholder="Order Received Qty" type="number" class="orderRecQty" style="max-width:140px"><button class="btn-red" onclick="this.parentElement.remove()">X</button></div>`;
  document.getElementById('itemList').innerHTML = `<div class="row-list"><input placeholder="Item Name" class="itemName"><input placeholder="Item Received Qty" type="number" class="itemRecQty" style="max-width:160px"><button class="btn-red" onclick="this.parentElement.remove()">X</button></div>`;
  document.getElementById('challanList').innerHTML = `<div class="row-list"><input placeholder="Challan No" class="challanNo"><button class="btn-red" onclick="this.parentElement.remove()">X</button></div>`;
}

function render(list){
  let tbody = document.getElementById('tableBody');
  if(!tbody) return;
  tbody.innerHTML='';
  let showList = list || data;
  document.getElementById('count').innerText = showList.length;
  let totalR=0;
  showList.forEach((d)=>{
    let orders = d.orders && d.orders.length ? d.orders : [{no:'', item:'', rec:''}];
    let items = d.items && d.items.length ? d.items : [{name:'', rec:''}];
    let challans = d.challans || [];
    let totORec = orders.reduce((s,i)=>s+(parseFloat(i.rec)||0),0);
    let totIRec = items.reduce((s,i)=>s+(parseFloat(i.rec)||0),0);
    let totR = totORec + totIRec;
    totalR+=totR;
    let challanText = challans.join(', ');
    let realIndex = data.indexOf(d);
    let maxRows = Math.max(orders.length, items.length, 1);
    for(let r=0; r<maxRows; r++){
      let o = orders[r] || {no:'', item:'', rec:''};
      let it = items[r] || {name:'', rec:''};
      if(r===0){
        tbody.innerHTML += `<tr>
          <td rowspan="${maxRows}">${formatDate(d.followDate)}</td>
          <td rowspan="${maxRows}">${d.buyer||''}</td>
          <td rowspan="${maxRows}"><b>${d.jobNo||''}</b></td>
          <td>${o.no||''}</td>
          <td>${o.item||''}</td>
          <td>${o.rec||''}</td>
          <td>${it.name||''}</td>
          <td>${it.rec||''}</td>
          <td rowspan="${maxRows}">${totR}</td>
          <td rowspan="${maxRows}">${challanText}</td>
          <td rowspan="${maxRows}">${d.receivedBy||''}</td>
          <td rowspan="${maxRows}">${formatDate(d.shipmentDate)}</td>
          <td rowspan="${maxRows}">${formatDate(d.receivedDate)}</td>
          <td rowspan="${maxRows}">${formatDate(d.followDate)}</td>
          <td rowspan="${maxRows}">${d.status||''}</td>
          <td rowspan="${maxRows}">${d.remarks||''}</td>
          <td rowspan="${maxRows}">
            <button class="btn-yellow" onclick="editData(${realIndex})">Edit</button>
            <button class="btn-red" onclick="delData(${realIndex})">Delete</button>
          </td>
        </tr>`;
      } else {
        tbody.innerHTML += `<tr>
          <td>${o.no||''}</td>
          <td>${o.item||''}</td>
          <td>${o.rec||''}</td>
          <td>${it.name||''}</td>
          <td>${it.rec||''}</td>
        </tr>`;
      }
    }
  });
  let sBox = document.getElementById('summaryBox');
  if(sBox){
    if(showList.length>0) sBox.innerHTML = `<div class="summary">Total Received Qty: ${totalR}</div>`;
    else sBox.innerHTML='';
  }
}

function editData(i){
  let d = data[i];
  if(!d) return;
  document.getElementById('jobNo').value = d.jobNo||'';
  document.getElementById('buyer').value = d.buyer||'';
  document.getElementById('receivedBy').value = d.receivedBy||'';
  document.getElementById('shipmentDate').value = d.shipmentDate||'';
  document.getElementById('receivedDate').value = d.receivedDate||'';
  document.getElementById('followDate').value = d.followDate||'';
  document.getElementById('status').value = d.status||'';
  document.getElementById('remarks').value = d.remarks||'';

  let orderList = document.getElementById('orderList');
  orderList.innerHTML='';
  (d.orders && d.orders.length ? d.orders : [{no:'',item:'',rec:''}]).forEach(o=>{
    let div = document.createElement('div');
    div.className='row-list';
    div.innerHTML = `<input placeholder="Order Name" class="orderNo" value="${o.no||''}"><input placeholder="Item" class="orderItem" value="${o.item||''}"><input placeholder="Order Received Qty" type="number" class="orderRecQty" style="max-width:140px" value="${o.rec||''}"><button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
    orderList.appendChild(div);
  });

  let itemList = document.getElementById('itemList');
  itemList.innerHTML='';
  (d.items && d.items.length ? d.items : [{name:'',rec:''}]).forEach(it=>{
    let div = document.createElement('div');
    div.className='row-list';
    div.innerHTML = `<input placeholder="Item Name" class="itemName" value="${it.name||''}"><input placeholder="Item Received Qty" type="number" class="itemRecQty" style="max-width:160px" value="${it.rec||''}"><button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
    itemList.appendChild(div);
  });

  let challanList = document.getElementById('challanList');
  challanList.innerHTML='';
  (d.challans && d.challans.length ? d.challans : ['']).forEach(ch=>{
    let div = document.createElement('div');
    div.className='row-list';
    div.innerHTML = `<input placeholder="Challan No" class="challanNo" value="${ch}"><button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
    challanList.appendChild(div);
  });

  editIndex=i;
  window.scrollTo(0,0);
}
function delData(i){if(confirm('Delete korba?')){data.splice(i,1); save();}}
function searchJob(){
  let q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){alert('Job No likho'); return;}
  let result = data.filter(d => (d.jobNo||'').toLowerCase().includes(q));
  if(result.length===0){alert('Ei Job No pawa jay nai'); render([]);} else render(result);
}
function showAll(){document.getElementById('searchInput').value=''; render();}
function exportExcel(){
  let csv='Date,Buyer,Job No,Order Name,Order Item,Order Rec Qty,Item Name,Item Rec Qty,Total Rec,Challan No,Received By,Shipment Date,Received Date,Follow Date,Status,Remarks\n';
  data.forEach(d=>{
    let orders = d.orders && d.orders.length ? d.orders : [{no:'',item:'',rec:''}];
    let items = d.items && d.items.length ? d.items : [{name:'',rec:''}];
    let maxRows = Math.max(orders.length, items.length, 1);
    for(let r=0; r<maxRows; r++){
      let o = orders[r] || {no:'', item:'', rec:''};
      let it = items[r] || {name:'', rec:''};
      let ch = r===0 ? (d.challans||[]).join(', ') : '';
      let totR = (d.orders||[]).reduce((s,i)=>s+(parseFloat(i.rec)||0),0)+(d.items||[]).reduce((s,i)=>s+(parseFloat(i.rec)||0),0);
      csv+=`${formatDate(d.followDate)},${d.buyer},${d.jobNo},${o.no},${o.item},${o.rec},${it.name},${it.rec},${totR},${ch},${d.receivedBy},${formatDate(d.shipmentDate)},${formatDate(d.receivedDate)},${formatDate(d.followDate)},${d.status},${d.remarks}\n`;
    }
  });
  let blob=new Blob([csv],{type:'text/csv'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='accessories-follow-up-g3.csv';
  a.click();
}
render();
</script>
</body>
</html>
