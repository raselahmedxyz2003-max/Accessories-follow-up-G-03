<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accessories Follow Up G-3</title>
<style>
body{margin:0;font-family:sans-serif;background:#f1f5f9}
.top{background:#1e3a8a;color:white;text-align:center;padding:16px;font-size:20px;font-weight:bold}
.box{max-width:1100px;margin:10px auto;padding:10px}
.card{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;color:white;background:#1e3a8a}
.btn-green{background:#16a34a}
.btn-red{background:#dc2626}
.btn-yellow{background:#eab308;color:black}
.btn-blue{background:#2563eb}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:8px;text-align:center;font-size:13px}
th{background:#1e3a8a;color:white}
input,select{padding:9px;width:95%;box-sizing:border-box}
label{font-size:13px;font-weight:bold;color:#1e3a8a}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-row,.challan-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.item-row input,.challan-row input{flex:1}
.summary{background:#ecfdf5;border:1px solid #16a34a;padding:10px;border-radius:8px;margin-top:10px;font-weight:bold}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">Accessories Follow Up G-3</div>
<div class="box">

<div class="card">
<h3>Search Job No</h3>
<div class="search">
<input id="searchInput" placeholder="Job No likho...">
<button class="btn" onclick="searchJob()">Search</button>
<button class="btn-yellow" onclick="showAll()">Show All</button>
</div>
<div id="summaryBox"></div>
</div>

<div class="card">
<h3>New Data Entry</h3>
<div class="form-grid">
<div>
<label>Job No *</label>
<input id="jobNo" placeholder="Job No">
</div>
<div>
<label>Buyer</label>
<select id="buyer">
<option value="">Buyer Select</option>
<option>C&A</option>
<option>Gina Tricot</option>
<option>Tom Tailor</option>
<option>Zara</option>
<option>Otcf</option>
<option>Gusse</option>
</select>
</div>
<div>
<label>Supplier</label>
<input id="supplier" placeholder="Supplier">
</div>
<div>
<label>Received By</label>
<select id="receivedBy">
<option value="">Select Name</option>
<option>Rasel Ahmed</option>
<option>Billal hossen</option>
<option>Rakib Ahmed</option>
<option>Sourov chandra Hauladar</option>
</select>
</div>
<div>
<label>Order No</label>
<input id="orderNo" placeholder="Order No">
</div>
<div>
<label>Order Received Qty</label>
<input id="orderRecQty" type="number" placeholder="Order Received Qty">
</div>
<div class="date-box"><label>Shipment Date</label><input id="shipmentDate" type="date"></div>
<div class="date-box"><label>Received Date</label><input id="receivedDate" type="date"></div>
<div class="date-box"><label>Follow Up Date</label><input id="followDate" type="date"></div>
<div>
<label>Status</label>
<select id="status">
<option value="">Status Select</option>
<option>Pending</option>
<option>Ordered</option>
<option>Shipped</option>
<option>Received</option>
<option>Follow Up</option>
</select>
</div>
<div><label>Remarks</label><input id="remarks" placeholder="Remarks"></div>
</div>

<div style="margin-top:14px">
<label>Item Name + Item Received Qty</label>
<div id="itemList">
<div class="item-row">
<input placeholder="Item Name" class="itemName">
<input placeholder="Item Received Qty" type="number" class="itemRecQty" style="max-width:160px">
<button class="btn-red" onclick="this.parentElement.remove()">X</button>
</div>
</div>
<button class="btn btn-blue" onclick="addItemRow()">+ Add Item</button>
</div>

<div style="margin-top:14px">
<label>Challan No</label>
<div id="challanList">
<div class="challan-row">
<input placeholder="Challan No" class="challanNo">
<button class="btn-red" onclick="this.parentElement.remove()">X</button>
</div>
</div>
<button class="btn btn-blue" onclick="addChallanRow()">+ Add Challan No</button>
</div>

<button class="btn btn-green" style="width:100%;margin-top:14px" onclick="addData()">Save Job</button>
</div>

<div class="card">
<h3>Follow Up List (<span id="count">0</span>)</h3>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Job No</th><th>Buyer</th><th>Supplier</th><th>Order No</th><th>Order Rec Qty</th><th>Items (Received Qty)</th><th>Total Rec</th><th>Challan No</th><th>Received By</th><th>Shipment Date</th><th>Received Date</th><th>Follow Date</th><th>Status</th><th>Remarks</th><th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
<button class="btn" style="margin-top:10px" onclick="exportExcel()">Export Excel</button>
</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem('accessories_g3_data') || '[]');
let editIndex = -1;

function addItemRow(){
  let div = document.createElement('div');
  div.className = 'item-row';
  div.innerHTML = `<input placeholder="Item Name" class="itemName">
  <input placeholder="Item Received Qty" type="number" class="itemRecQty" style="max-width:160px">
  <button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
  document.getElementById('itemList').appendChild(div);
}
function addChallanRow(){
  let div = document.createElement('div');
  div.className = 'challan-row';
  div.innerHTML = `<input placeholder="Challan No" class="challanNo">
  <button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
  document.getElementById('challanList').appendChild(div);
}

function save(){localStorage.setItem('accessories_g3_data', JSON.stringify(data)); render();}

function addData(){
  let jobNo = document.getElementById('jobNo').value.trim();
  if(!jobNo){alert('Job No likho'); return;}
  let items = [];
  document.querySelectorAll('#itemList .item-row').forEach(r=>{
    let name = r.querySelector('.itemName').value.trim();
    let rec = r.querySelector('.itemRecQty').value;
    if(name || rec) items.push({name, rec});
  });
  let challans = [];
  document.querySelectorAll('#challanList .challanNo').forEach(c=>{
    if(c.value.trim()) challans.push(c.value.trim());
  });

  let obj = {
    jobNo,
    buyer: document.getElementById('buyer').value,
    supplier: document.getElementById('supplier').value,
    receivedBy: document.getElementById('receivedBy').value,
    orderNo: document.getElementById('orderNo').value.trim(),
    orderRecQty: document.getElementById('orderRecQty').value,
    shipmentDate: document.getElementById('shipmentDate').value,
    receivedDate: document.getElementById('receivedDate').value,
    followDate: document.getElementById('followDate').value,
    status: document.getElementById('status').value,
    remarks: document.getElementById('remarks').value,
    items,
    challans
  };

  if(editIndex >= 0){data[editIndex]=obj; editIndex=-1;}
  else data.push(obj);

  clearForm();
  save();
  alert('Save hoise');
}

function clearForm(){
  document.getElementById('jobNo').value='';
  document.getElementById('buyer').value='';
  document.getElementById('supplier').value='';
  document.getElementById('receivedBy').value='';
  document.getElementById('orderNo').value='';
  document.getElementById('orderRecQty').value='';
  document.getElementById('shipmentDate').value='';
  document.getElementById('receivedDate').value='';
  document.getElementById('followDate').value='';
  document.getElementById('status').value='';
  document.getElementById('remarks').value='';
  document.getElementById('itemList').innerHTML = `<div class="item-row"><input placeholder="Item Name" class="itemName"><input placeholder="Item Received Qty" type="number" class="itemRecQty" style="max-width:160px"><button class="btn-red" onclick="this.parentElement.remove()">X</button></div>`;
  document.getElementById('challanList').innerHTML = `<div class="challan-row"><input placeholder="Challan No" class="challanNo"><button class="btn-red" onclick="this.parentElement.remove()">X</button></div>`;
}

function render(list){
  let tbody = document.getElementById('tableBody');
  tbody.innerHTML='';
  let showList = list || data;
  document.getElementById('count').innerText = showList.length;
  let totalRec = 0;
  showList.forEach((d)=>{
    let totR = d.items.reduce((s,i)=>s+(parseFloat(i.rec)||0),0);
    totalRec += totR + (parseFloat(d.orderRecQty)||0);
    let itemText = d.items.map(i=>`${i.name} (${i.rec||0})`).join('<br>');
    let challanText = (d.challans||[]).join(', ');
    let realIndex = data.indexOf(d);
    tbody.innerHTML += `<tr>
      <td><b>${d.jobNo}</b></td>
      <td>${d.buyer||''}</td>
      <td>${d.supplier||''}</td>
      <td>${d.orderNo||''}</td>
      <td>${d.orderRecQty||''}</td>
      <td style="text-align:left">${itemText}</td>
      <td>${totR}</td>
      <td>${challanText}</td>
      <td>${d.receivedBy||''}</td>
      <td>${d.shipmentDate||''}</td>
      <td>${d.receivedDate||''}</td>
      <td>${d.followDate||''}</td>
      <td>${d.status||''}</td>
      <td>${d.remarks||''}</td>
      <td>
        <button class="btn-yellow" onclick="editData(${realIndex})">Edit</button>
        <button class="btn-red" onclick="delData(${realIndex})">Delete</button>
      </td>
    </tr>`;
  });
  if(showList.length>0){
    document.getElementById('summaryBox').innerHTML = `<div class="summary">Total Received Qty: ${totalRec}</div>`;
  } else document.getElementById('summaryBox').innerHTML='';
}

function editData(i){
  let d = data[i];
  document.getElementById('jobNo').value = d.jobNo;
  document.getElementById('buyer').value = d.buyer;
  document.getElementById('supplier').value = d.supplier;
  document.getElementById('receivedBy').value = d.receivedBy;
  document.getElementById('orderNo').value = d.orderNo;
  document.getElementById('orderRecQty').value = d.orderRecQty;
  document.getElementById('shipmentDate').value = d.shipmentDate;
  document.getElementById('receivedDate').value = d.receivedDate;
  document.getElementById('followDate').value = d.followDate;
  document.getElementById('status').value = d.status;
  document.getElementById('remarks').value = d.remarks;

  let itemList = document.getElementById('itemList');
  itemList.innerHTML='';
  d.items.forEach(it=>{
    let div = document.createElement('div');
    div.className='item-row';
    div.innerHTML = `<input placeholder="Item Name" class="itemName" value="${it.name}"><input placeholder="Item Received Qty" type="number" class="itemRecQty" style="max-width:160px" value="${it.rec}"><button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
    itemList.appendChild(div);
  });

  let challanList = document.getElementById('challanList');
  challanList.innerHTML='';
  (d.challans||['']).forEach(ch=>{
    let div = document.createElement('div');
    div.className='challan-row';
    div.innerHTML = `<input placeholder="Challan No" class="challanNo" value="${ch}"><button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
    challanList.appendChild(div);
  });

  editIndex=i;
  window.scrollTo(0,0);
}
function delData(i){if(confirm('Delete korba?')){data.splice(i,1); save();}}
function searchJob(){
  let q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){alert('Job No likho'); return;}
  let result = data.filter(d => d.jobNo.toLowerCase().includes(q));
  if(result.length===0){alert('Ei Job No pawa jay nai'); render([]);} else render(result);
}
