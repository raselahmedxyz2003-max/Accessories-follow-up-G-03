<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessories Follow Up G-3</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:10px}
.card{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
h2{margin:0 0 10px}
input,select{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;margin:3px 0}
.btn-blue{background:#2563eb;color:#fff}
.btn-green{background:#16a34a;color:#fff;width:100%;padding:12px}
.btn-yellow{background:#eab308}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #ddd;padding:6px;text-align:left}
th{background:#1e3a8a;color:#fff}
</style>
</head>
<body>
<div class="card">
<h2>Accessories Follow Up G-3</h2>
<input id="searchInput" placeholder="Job No likho...">
<button class="btn-blue" onclick="searchJob()">Search</button>
<button class="btn-yellow" onclick="loadData()">Show All</button>
<div id="totalDiv" style="margin-top:10px;background:#dcfce7;padding:8px;border-radius:6px">Total Received Qty: 0</div>
</div>

<div class="card">
<h2>New Data Entry</h2>
<label>Job No *</label><input id="jobNo" placeholder="Job No">
<label>Buyer</label><input id="buyer" placeholder="Buyer">
<label>Received By</label><input id="receivedBy" placeholder="Received By">
<label>Shipment Date</label><input id="shipmentDate" type="date">
<label>Received Date</label><input id="receivedDate" type="date">
<label>Follow Up Date</label><input id="followDate" type="date">
<label>Status</label><input id="status" placeholder="Status">
<label>Remarks</label><input id="remarks" placeholder="Remarks">
<label>Order Name | Item | Order Received Qty</label>
<div id="orderDiv"><div><input class="oName" placeholder="Order Name"><input class="oItem" placeholder="Item"><input class="oQty" placeholder="Order Received Qty" type="number"></div></div>
<button class="btn-blue" onclick="addOrder()">+ Add Order No</button>
<label>Item Name | Item Received Qty</label>
<div id="itemDiv"><div><input class="iName" placeholder="Item Name"><input class="iQty" placeholder="Item Received Qty" type="number"></div></div>
<button class="btn-blue" onclick="addItem()">+ Add Item</button>
<label>Challan No</label>
<div id="challanDiv"><input class="cNo" placeholder="Challan No"></div>
<button class="btn-blue" onclick="addChallan()">+ Add Challan No</button>
<button class="btn-green" onclick="saveJob()">Save Job</button>
</div>

<div class="card">
<h2>Follow Up List (<span id="count">0</span>)</h2>
<table>
<thead><tr><th>Received</th><th>Challan No</th><th>Buyer</th><th>Job No</th><th>Order Name</th><th>Item</th><th>Order Rec Qty</th><th>Item Name</th><th>Item Rec Qty</th><th>Total Rec</th><th>Received By</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
<button class="btn-blue" onclick="exportExcel()">Export Excel</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwdriJHMkNjtVWib3JN8Pq7i6eOHjg5FzXYZ/exec";

function addOrder(){document.getElementById('orderDiv').insertAdjacentHTML('beforeend','<div><input class="oName" placeholder="Order Name"><input class="oItem" placeholder="Item"><input class="oQty" placeholder="Order Received Qty" type="number"></div>')}
function addItem(){document.getElementById('itemDiv').insertAdjacentHTML('beforeend','<div><input class="iName" placeholder="Item Name"><input class="iQty" placeholder="Item Received Qty" type="number"></div>')}
function addChallan(){document.getElementById('challanDiv').insertAdjacentHTML('beforeend','<input class="cNo" placeholder="Challan No">')}

function collect(){
  const oNames=[...document.querySelectorAll('.oName')].map(e=>e.value).filter(v=>v).join(", ");
  const oItems=[...document.querySelectorAll('.oItem')].map(e=>e.value).filter(v=>v).join(", ");
  const oQtys=[...document.querySelectorAll('.oQty')].map(e=>e.value).filter(v=>v).join(", ");
  const iNames=[...document.querySelectorAll('.iName')].map(e=>e.value).filter(v=>v).join(", ");
  const iQtys=[...document.querySelectorAll('.iQty')].map(e=>e.value).filter(v=>v).join(", ");
  const cNos=[...document.querySelectorAll('.cNo')].map(e=>e.value).filter(v=>v).join(", ");
  return {
    "Job No":document.getElementById('jobNo').value.trim(),
    "Buyer":document.getElementById('buyer').value,
    "Received By":document.getElementById('receivedBy').value,
    "Shipment Date":document.getElementById('shipmentDate').value,
    "Received Date":document.getElementById('receivedDate').value,
    "Follow Up Date":document.getElementById('followDate').value,
    "Status":document.getElementById('status').value,
    "Remarks":document.getElementById('remarks').value,
    "Order Name":oNames,
    "Item":oItems,
    "Order Rec Qty":oQtys,
    "Item Name":iNames,
    "Item Rec Qty":iQtys,
    "Challan No":cNos
  };
}

async function saveJob(){
  const data=collect();
  if(!data["Job No"]){alert("Job No dao");return}
  const res=await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"add",data})});
  const j=await res.json();
  alert("Save hoise");
  loadData();
}

async function loadData(){
  const res=await fetch(API_URL);
  const data=await res.json();
  render(data);
}
function searchJob(){
  const q=document.getElementById('searchInput').value.trim();
  fetch(API_URL).then(r=>r.json()).then(d=>render(d.filter(x=>String(x["Job No"]).includes(q))));
}
function render(data){
  document.getElementById('count').innerText=data.length;
  let total=0;
  const tb=document.getElementById('tbody');
  tb.innerHTML=data.map(r=>{
    total+=parseFloat(r["Total Rec"])||0;
    return `<tr><td>${r["Received Date"]||""}</td><td>${r["Challan No"]||""}</td><td>${r["Buyer"]||""}</td><td>${r["Job No"]||""}</td><td>${r["Order Name"]||""}</td><td>${r["Item"]||""}</td><td>${r["Order Rec Qty"]||""}</td><td>${r["Item Name"]||""}</td><td>${r["Item Rec Qty"]||""}</td><td>${r["Total Rec"]||0}</td><td>${r["Received By"]||""}</td></tr>`;
  }).join("");
  document.getElementById('totalDiv').innerText="Total Received Qty: "+total;
}
function exportExcel(){
  const table=document.querySelector('table');
  const html=table.outerHTML;
  const blob=new Blob([html],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='followup.xls';
  a.click();
}
loadData();
</script>
</body>
</html>
